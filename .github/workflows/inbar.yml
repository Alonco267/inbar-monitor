name: Inbar grade check

on:
  schedule:
    # Every 5 minutes during daytime Israel hours.
    # GitHub cron is UTC. Israel is UTC+2 (winter) / UTC+3 (DST), so the
    # window below is roughly 07:00–22:55 local in winter, 08:00–23:55 in DST.
    # WARNING: a private repo will burn ~9,500 Actions minutes/month at this
    # rate (free tier = 2,000). Make the repo public for unlimited free Actions.
    - cron: "*/5 5-20 * * *"
  workflow_dispatch:        # manual "Run workflow" button

concurrency:
  group: inbar-check
  cancel-in-progress: false  # don't kill an in-flight OTP login

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8       # plenty for scrape; allows OTP wait if needed
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps (always runs, fast — pip cache hits)
        run: pip install -r requirements.txt

      # requirements.txt pins playwright loosely (>=1.40.0), so the resolved
      # version — and with it the Chromium build number — changes without the
      # file changing. Key the cache on the resolved version, not the file.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Cache Playwright's Chromium binary across runs (~100MB).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Idempotent: a no-op download on a cache hit, and it still installs the
      # OS libs, which live outside the cached path and never survive a run.
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run one-shot grade check
        env:
          RELAY_URL:      ${{ secrets.RELAY_URL }}
          DAEMON_TOKEN:   ${{ secrets.DAEMON_TOKEN }}
          INBAR_USERNAME: ${{ secrets.INBAR_USERNAME }}
          INBAR_PASSWORD: ${{ secrets.INBAR_PASSWORD }}
          INBAR_ID:       ${{ secrets.INBAR_ID }}
          INBAR_PHONE:    ${{ secrets.INBAR_PHONE }}
        run: python monitor_once.py
