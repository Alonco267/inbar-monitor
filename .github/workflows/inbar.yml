name: Inbar grade check

on:
  schedule:
    # Every 15 minutes, 08:00–22:45 Israel time.
    # GitHub cron is UTC. Israel is UTC+2 (winter) / UTC+3 (DST).
    # Using UTC+2 baseline (05:00–20:45 UTC) — during DST the window shifts to
    # 09:00–23:45 local, which is fine for grade-watching.
    - cron: "*/15 5-20 * * *"
  workflow_dispatch:        # manual "Run workflow" button

concurrency:
  group: inbar-check
  cancel-in-progress: false  # don't kill an in-flight OTP login

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8       # plenty for scrape; allows OTP wait if needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run one-shot grade check
        env:
          RELAY_URL:      ${{ secrets.RELAY_URL }}
          DAEMON_TOKEN:   ${{ secrets.DAEMON_TOKEN }}
          INBAR_USERNAME: ${{ secrets.INBAR_USERNAME }}
          INBAR_PASSWORD: ${{ secrets.INBAR_PASSWORD }}
          INBAR_ID:       ${{ secrets.INBAR_ID }}
          INBAR_PHONE:    ${{ secrets.INBAR_PHONE }}
        run: python monitor_once.py
